<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
</head>
<body style="margin:0">
<title>CappyGameStudio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="CappyGameStudio – środowisko do tworzenia gier 2D przez konfigurowanie obiektów, komponentów i mechanik. Bez kodu, bez bloczków, bez AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Rubik:wght@400;500;700&display=swap">
<style>

/* Layout: toy-box workshop — chunky outlined "stickers" with hard drop shadows; board in the middle, library left, settings right. */
:root{
  --bg:#fff4e0; --surface:#ffffff; --surface2:#fff8ec; --sunk:#fbe6c2;
  --text:#2d2547; --muted:#655a7c; --edge:#2d2547; --line:#e9c995;
  --primary:#3a4cc0; --primary-text:#ffffff; --accent:#ff9a1f; --accent-soft:#ffe2b8;
  --plum:#7b4fd6; --plum-soft:#ede3ff; --sky:#dfe5ff;
  --ok:#1e7f45; --ok-soft:#ddf5e5; --warn:#955300; --warn-soft:#fff0d1; --err:#be2a3e; --err-soft:#fde0e4;
  --focus:#3a4cc0;
  --f-display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px; --r-sm:10px;
  --sh:0 3px 0 var(--edge); --sh-lg:0 5px 0 var(--edge);
  --fs-xs:.78rem; --fs-sm:.88rem; --fs-md:1rem; --fs-lg:1.2rem; --fs-xl:1.6rem; --fs-2xl:2.3rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f1a2e; --surface:#2b2440; --surface2:#352d4e; --sunk:#17132a;
  --text:#fff4e0; --muted:#cbbfda; --edge:#0d0a16; --line:#4c4169;
  --primary:#8e9cff; --primary-text:#141838; --accent:#ffab45; --accent-soft:#4a3016;
  --plum:#b193ff; --plum-soft:#3a2c5e; --sky:#2c3366;
  --ok:#6be39a; --ok-soft:#163626; --warn:#ffc766; --warn-soft:#3a2c10; --err:#ff8a9a; --err-soft:#3d1820;
  --focus:#ffc766;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1f1a2e; --surface:#2b2440; --surface2:#352d4e; --sunk:#17132a;
  --text:#fff4e0; --muted:#cbbfda; --edge:#0d0a16; --line:#4c4169;
  --primary:#8e9cff; --primary-text:#141838; --accent:#ffab45; --accent-soft:#4a3016;
  --plum:#b193ff; --plum-soft:#3a2c5e; --sky:#2c3366;
  --ok:#6be39a; --ok-soft:#163626; --warn:#ffc766; --warn-soft:#3a2c10; --err:#ff8a9a; --err-soft:#3d1820;
  --focus:#ffc766;
  color-scheme:dark;
}
html.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff; --sunk:#f0f0f0; --text:#000000; --muted:#000000; --edge:#000000; --line:#000000;
  --primary:#00574a; --primary-text:#ffffff; --accent:#ffb000; --accent-soft:#ffffff; --plum:#3a1f7a; --plum-soft:#ffffff; --sky:#ffffff;
  --ok:#00562b; --ok-soft:#ffffff; --warn:#6b3c00; --warn-soft:#ffffff; --err:#9b0018; --err-soft:#ffffff; color-scheme:light;
}
html.hc *{border-color:#000 !important}
html.big{font-size:118%}
html.rm *,html.rm *::before,html.rm *::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}

html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
#app{display:grid;grid-template-rows:auto 1fr auto;min-height:100%;height:100%}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;font-weight:800}
h1{font-size:var(--fs-2xl)} h2{font-size:var(--fs-xl)} h3{font-size:var(--fs-lg);font-weight:700}
p{margin:0}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:3px solid var(--edge);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);border:0;background:none;padding:0;cursor:pointer}
.brand img{width:44px;height:44px}
.brand b{font-family:var(--f-display);font-size:1.35rem;font-weight:800;letter-spacing:-.01em;line-height:1}
.brand small{display:inline-block;margin-left:6px;padding:1px 8px;border:2px solid var(--edge);border-radius:999px;background:var(--accent);color:#1d2440;font:800 .78rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;vertical-align:3px}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.nav a{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--text);font-weight:600;border:2px solid transparent;font-size:var(--fs-sm)}
.nav a:hover{border-color:var(--line)}
.nav a[aria-current="page"]{border-color:var(--edge);background:var(--accent-soft);box-shadow:0 2px 0 var(--edge)}
.nav svg{width:20px;height:20px}
@media (max-width:860px){.nav a span{display:none}.nav a{padding:6px 9px}.brand b{font-size:1.1rem}}
@media (max-width:560px){.brand span{display:none}.nav{flex-wrap:nowrap;gap:2px}.nav a{padding:6px 7px}.top{gap:6px}}

main#view{min-height:0;overflow:auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main#view.full{padding:0;overflow:hidden;display:flex;flex-direction:column}
.wrap{max-width:1140px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.foot{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:2px solid var(--line);background:var(--surface);font-size:var(--fs-sm);color:var(--muted)}
.foot strong{color:var(--text);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border:2px solid var(--edge);border-radius:12px;background:var(--surface);color:var(--text);font:700 1.02rem var(--f-display);box-shadow:var(--sh);cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh)}
.btn svg{width:20px;height:20px;flex:none}
.btn.pri{background:var(--primary);color:var(--primary-text)}
.btn.pri:hover{background:var(--primary);filter:brightness(1.07)}
.btn.acc{background:var(--accent);color:#2d2547}
.btn.acc:hover{background:var(--accent);filter:brightness(1.05)}
.btn.danger{color:var(--err)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:.92rem;border-radius:10px}
.btn.icon{padding:6px;min-width:44px}
.btn.sm.icon{min-width:36px}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn.ghost:hover{border-color:var(--line)}
.btn.on{background:var(--accent-soft);}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}

/* cards */
.card{background:var(--surface);border:2px solid var(--edge);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.soft{background:var(--surface2);border:2px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}
.xs{font-size:var(--fs-xs)}
.eyebrow{font:800 .78rem var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--plum)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border:2px solid var(--edge);border-radius:999px;font-size:var(--fs-xs);font-weight:700;background:var(--surface2);white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.plum{background:var(--plum-soft);color:var(--plum)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

/* start screen */
.hero-band{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:var(--sky);border:3px solid var(--edge);border-radius:22px;box-shadow:var(--sh-lg);padding:22px 26px;position:relative;overflow:hidden}
.hero-band canvas{width:150px;height:150px}
.hero-band h1{font-size:clamp(1.8rem,4vw,2.8rem)}
.hero-band p{max-width:58ch;margin-top:8px;font-size:1.05rem}
@media (max-width:620px){.hero-band{grid-template-columns:1fr;text-align:center;justify-items:center}.hero-band canvas{width:110px;height:110px}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px;border:3px solid var(--edge);border-radius:18px;background:var(--surface);box-shadow:var(--sh-lg);text-align:left;cursor:pointer;min-height:150px;transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.tile .ti{width:52px;height:52px;border-radius:14px;border:2px solid var(--edge);display:grid;place-items:center}
.tile .ti svg{width:30px;height:30px}
.tile b{font:800 1.35rem var(--f-display)}
.tile span{color:var(--muted);font-size:var(--fs-sm)}
.t1 .ti{background:var(--accent)} .t2 .ti{background:#9ee6c9} .t3 .ti{background:#c9b8f2} .t4 .ti{background:#9fd3ff}
.t1{background:var(--accent-soft)}

/* project cards */
.pcard{display:flex;flex-direction:column;border:2px solid var(--edge);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);overflow:hidden;min-width:0}
.pcard .thumb{display:block;width:100%;aspect-ratio:5/3;object-fit:cover;border-bottom:2px solid var(--edge);background:var(--sunk)}
.pcard .pb{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard h3{font-size:1.15rem;overflow-wrap:anywhere}
.pcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}

/* wizard */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps li{list-style:none;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:999px;border:2px solid var(--line);font-weight:600;font-size:var(--fs-sm);color:var(--muted)}
.steps li i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface2);border:2px solid var(--line);font:800 .9rem var(--f-display)}
.steps li.cur{border-color:var(--edge);color:var(--text);background:var(--accent-soft)}
.steps li.cur i{background:var(--accent);border-color:var(--edge);color:#1d2440}
.steps li.done i{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.steps{padding:0;margin:0}
.choice-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.choice{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px;border:2px solid var(--edge);border-radius:16px;background:var(--surface);box-shadow:var(--sh);cursor:pointer;text-align:left}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice:has(input:checked){background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent),var(--sh)}
.choice:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:3px}
.choice:has(input:disabled){opacity:.55;cursor:not-allowed}
.choice b{font:800 1.15rem var(--f-display)}
.choice .pic{height:84px;border-radius:10px;border:2px solid var(--edge);overflow:hidden;background:var(--sunk)}
.choice .pic img,.choice .pic canvas{width:100%;height:100%;object-fit:cover;display:block}
.choice .tick{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);display:grid;place-items:center}
.choice:has(input:checked) .tick{background:var(--primary);color:#fff}
.choice .tick svg{width:16px;height:16px;opacity:0}
.choice:has(input:checked) .tick svg{opacity:1}
.swatch{width:100%;height:84px;border-radius:10px;border:2px solid var(--edge)}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:var(--fs-sm)}
.inp,select.inp,textarea.inp{border:2px solid var(--edge);border-radius:10px;background:var(--surface);padding:9px 12px;min-height:44px;font-size:1rem;width:100%;box-sizing:border-box}
textarea.inp{min-height:70px;resize:vertical}
.inp.big{font:700 1.4rem var(--f-display)}
.help{font-weight:400;color:var(--muted);font-size:var(--fs-xs)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:var(--fs-sm)}
.sw input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:999px;border:2px solid var(--edge);background:var(--sunk);position:relative;flex:none;cursor:pointer;margin:0}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--edge);box-sizing:border-box;transition:left .12s}
.sw input:checked{background:var(--primary)}
.sw input:checked::after{left:22px}
.sw .st{font-size:var(--fs-xs);font-weight:700;color:var(--muted);min-width:4.2em}
input[type=range]{width:100%;accent-color:var(--primary);min-height:28px}
.rng{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.rng output{font:800 1rem var(--f-display);min-width:2.4em;text-align:center;padding:0 6px;border:2px solid var(--edge);border-radius:8px;background:var(--surface2);font-variant-numeric:tabular-nums}
.rng .lb{grid-column:1/-1;font-weight:600;font-size:var(--fs-sm)}

/* editor */
.ed{display:flex;flex-direction:column;height:100%;min-height:0}
.edbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:2px solid var(--line)}
.edbar .name{font:800 1.1rem var(--f-display);border:2px solid transparent;border-radius:10px;padding:4px 8px;background:transparent;min-width:0;width:12ch;max-width:30vw}
@media (max-width:1500px){.edbar .lbl-x{display:none}.tabs button{padding:7px 11px}}
.edbar .name:hover{border-color:var(--line)}
.edbar .name:focus{border-color:var(--edge);background:var(--surface)}
.tabs{display:inline-flex;border:2px solid var(--edge);border-radius:12px;overflow:hidden;box-shadow:var(--sh);background:var(--surface)}
.tabs button{border:0;background:transparent;padding:7px 14px;font:700 .98rem var(--f-display);cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:40px}
.tabs button+button{border-left:2px solid var(--edge)}
.tabs button[aria-selected="true"]{background:var(--plum);color:#fff}
.tabs svg{width:18px;height:18px}
.saved{font-size:var(--fs-xs);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.saved svg{width:14px;height:14px}
.edbody{flex:1;min-height:0;display:grid;grid-template-columns:268px minmax(0,1fr) 300px}
.lib,.props{min-height:0;overflow:auto;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:12px}
.lib{border-right:2px solid var(--line)}
.props{border-left:2px solid var(--line)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.cat{min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:2px solid var(--line);border-radius:10px;background:var(--surface2);cursor:pointer;font-size:.68rem;font-weight:700;color:var(--text)}
.cat img{width:30px;height:30px}
.cat[aria-pressed="true"]{border-color:var(--edge);background:var(--accent-soft);box-shadow:0 2px 0 var(--edge)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:grab;font-size:.72rem;font-weight:600;text-align:center;line-height:1.15;min-height:84px}
.item img{width:44px;height:44px;pointer-events:none}
.item:hover{border-color:var(--edge)}
.item[aria-pressed="true"]{border-color:var(--edge);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.item .tag{font-size:.6rem;font-weight:700;color:var(--plum)}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--sunk)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:2px solid var(--line);background:var(--surface2)}
.seg{display:inline-flex;border:2px solid var(--edge);border-radius:11px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;min-height:38px;display:inline-flex;align-items:center;gap:5px;font:700 .9rem var(--f-display);cursor:pointer}
.seg button+button{border-left:2px solid var(--edge)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-text)}
.seg svg{width:18px;height:18px}
.zoomv{font:700 .85rem var(--f-display);min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums}
.canvaswrap{flex:1;min-height:0;overflow:auto;padding:18px;display:flex}
.canvaswrap canvas{margin:auto;border:3px solid var(--edge);border-radius:8px;box-shadow:var(--sh-lg);touch-action:none;cursor:crosshair;background:#fff;flex:none}
.canvaswrap canvas:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.hintbar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:2px solid var(--line);background:var(--surface);font-size:var(--fs-sm);min-height:44px}
.hintbar svg{width:22px;height:22px;flex:none}
.ptitle{display:flex;gap:10px;align-items:center}
.ptitle img{width:52px;height:52px;border:2px solid var(--edge);border-radius:12px;background:var(--surface2);flex:none}
.ptitle h3{font-size:1.15rem}
.beh{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.beh.on{border-color:var(--edge);background:var(--surface)}
.beh-h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.beh-h b{font:700 1rem var(--f-display)}
.beh p{font-size:var(--fs-xs);color:var(--muted)}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);border-radius:10px;padding:4px;background:var(--surface);cursor:pointer;font-size:.66rem;font-weight:700;width:62px}
.vchip img{width:36px;height:36px}
.vchip[aria-pressed="true"]{border-color:var(--edge);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.sec-t{font:800 .75rem var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tasks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0}
.tasks li{list-style:none;display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-sm);padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--surface)}
.tasks li .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--edge);flex:none;display:grid;place-items:center;background:var(--surface)}
.tasks li.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.tasks li.done{color:var(--muted)}
.tasks li.done b{text-decoration:line-through}
.tasks li .bx svg{width:14px;height:14px}
.tasks li.next{border-color:var(--edge);background:var(--accent-soft)}
.tasks small{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}

body{font-size:16px}
main#view,.pane.scroll{background-color:var(--bg);background-image:radial-gradient(var(--paper-dot) 1.6px,transparent 1.7px);background-size:22px 22px}
.top{border-bottom-width:4px;background:var(--surface)}
.brand b{font-size:1.45rem;letter-spacing:-.01em}
.brand b i{font-style:normal;color:var(--brand-accent,var(--accent))}
.brand img{width:48px;height:48px}
.top .pname{font-size:1.1rem;background:var(--accent-soft);border:2px solid var(--edge);border-radius:999px;padding:4px 14px;box-shadow:0 2px 0 var(--edge)}
.top .acts .btn{min-height:42px}
.btn.big{min-height:48px;padding:8px 20px;font-size:1.12rem}
/* step path */
.mnav{padding:12px 10px 16px;gap:2px;background:var(--surface);border-right:3px solid var(--edge)}
.mnav .navt{font:800 .72rem var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:2px 8px 6px}
.mnav a.step{position:relative;flex-direction:row;align-items:center;gap:10px;padding:6px 8px;border-radius:14px;text-align:left;font-size:.92rem;border:2px solid transparent}
.mnav a.step .ti{position:relative;flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--c);color:var(--on-mod);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge)}
.mnav a.step .ti svg{width:23px;height:23px}
.mnav a.step .num{position:absolute;top:-7px;left:-7px;width:20px;height:20px;border-radius:50%;background:var(--surface);color:var(--text);border:2px solid var(--edge);font:800 .7rem/16px var(--f-display);text-align:center}
.mnav a.step .tx{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.mnav a.step .tx b{font:800 1rem var(--f-display)}
.mnav a.step .tx small{font-size:.72rem;color:var(--muted);font-weight:500}
.mnav a.step:not(:last-of-type)::after{content:"";position:absolute;left:28px;top:52px;height:12px;border-left:3px dotted var(--line)}
.mnav a.step:hover{background:var(--surface2);border-color:var(--line)}
.mnav a.step[aria-current="page"]{background:var(--surface2);border-color:var(--edge);box-shadow:0 3px 0 var(--edge)}
.mnav a.step[aria-current="page"] .ti{transform:scale(1.08) rotate(-4deg)}
.mnav a.step.play .ti{width:46px;height:46px;border-radius:50%}
.mnav a.small{flex-direction:row;gap:10px;align-items:center;padding:7px 10px;font-size:.88rem;text-align:left;border-radius:12px}
.mnav a.small svg{width:20px;height:20px;color:var(--muted)}
.mnav hr{margin:10px 6px}
/* module bar with Cappy */
.col{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
#modbar{display:flex;align-items:center;gap:14px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px 16px;background:var(--surface);border-bottom:3px solid var(--mod);position:relative}
#modbar .mt{width:46px;height:46px;flex:none;border-radius:14px;background:var(--mod);color:var(--on-mod);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);display:grid;place-items:center}
#modbar .mt svg{width:26px;height:26px}
#modbar .mh{display:flex;flex-direction:column;min-width:0}
#modbar .mh small{font:800 .7rem var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--mod)}
#modbar .mh b{font:800 1.35rem/1.05 var(--f-display)}
.cappy{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.cappy img{width:40px;height:40px;flex:none}
.bubble{position:relative;background:var(--accent-soft);border:2px solid var(--edge);border-radius:14px;padding:6px 12px;font-size:.9rem;font-weight:500;line-height:1.3;max-width:62ch}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:12px;height:12px;background:inherit;border-left:2px solid var(--edge);border-bottom:2px solid var(--edge);transform:translateY(-50%) rotate(45deg)}
#modbar .stepnav{display:flex;gap:6px;flex:none}
/* module accent everywhere */
.eyebrow{color:var(--mod)}
.sec{border-radius:18px;border-width:3px;box-shadow:0 4px 0 var(--edge)}
.sec h3 svg{width:30px;height:30px;padding:5px;border-radius:9px;background:var(--mod);color:var(--on-mod);box-sizing:border-box}
.ptabs button[aria-selected="true"]{background:var(--mod)}
.seg button[aria-pressed="true"]{background:var(--mod);color:var(--on-mod)}
.seg button{min-height:42px}
.seg.labels button span{font-size:.85rem}
.orow[aria-pressed="true"],.orow[aria-current="true"]{border-color:var(--mod);background:var(--surface2);box-shadow:inset 4px 0 0 var(--mod)}
.orow img{width:36px;height:36px}
.ogroup{color:var(--mod)}
.hero-band{border-width:4px;border-radius:26px;background:linear-gradient(135deg,var(--sky),var(--accent-soft))}
.tplgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tpl{display:flex;flex-direction:column;border:3px solid var(--edge);border-radius:20px;background:var(--surface);box-shadow:0 5px 0 var(--edge);overflow:hidden;cursor:pointer;text-align:left;padding:0;color:var(--text);transition:transform .1s}
.tpl:hover{transform:translateY(-3px) rotate(-.5deg)}
.tpl:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.tpl img{width:100%;aspect-ratio:5/3;object-fit:cover;border-bottom:3px solid var(--edge);display:block;background:var(--sunk)}
.tpl .tb{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tpl .tb b{font:800 1.2rem var(--f-display)}
.tpl .tb span{font-size:.85rem;color:var(--muted)}
.tpl .tag{align-self:flex-start;font:800 .66rem var(--f-display);letter-spacing:.07em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--c);color:var(--on-mod)}
.pcard{border-width:3px;border-radius:18px;box-shadow:0 4px 0 var(--edge)}
.diag{border-top:3px solid var(--edge)}
.diag-bar button.tg{font-size:.98rem}
.comp{border-radius:16px}
.empty{border-radius:18px;border-width:3px}

.ptitle{flex-wrap:wrap}.pane>.wrap{min-width:0;max-width:100%!important}

  if (mod && k === 'c') { SE.clip = SE.sel.map(instById).filter(Boolean).map(clone); if (SE.clip.length) toast('Skopiowano: ' + SE.clip.length); return; }
  if (mod && k === 'v') { if (SE.clip.length) pasteInst(SE.clip); e.preventDefault(); return; }
  if (mod && k === 'd') { e.preventDefault(); ACT.seDup(); return; }
  if (mod) return;

  if (e.key === 'Escape') { SE.sel = []; seRight(); drawSE(); seHint(); return; }
  var tools = { v: 'select', b: 'brush', r: 'rect', e: 'erase', h: 'hand' };
  if (tools[k]) { SE.tool = tools[k]; seTools(); seHint(); drawSE(); return; }
  var dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (dir && t && t.id === 'se-cv') {
    e.preventDefault(); var sc = curScene();
    var sel = SE.sel.map(instById).filter(function (i) { return i && !i.locked; });
    if (sel.length && SE.tool === 'select') { if (sel.every(function (i) { return inScene({ x: i.x + dir[0], y: i.y + dir[1] }); })) { pushUndo('kmove'); sel.forEach(function (i) { i.x += dir[0]; i.y += dir[1]; }); touched({ quiet: true }); drawSE(); seRight(); } }
    else { SE.cursor.x = clamp(SE.cursor.x + dir[0], 0, sc.cols - 1); SE.cursor.y = clamp(SE.cursor.y + dir[1], 0, sc.rows - 1); drawSE(); }
  }

    e.preventDefault(); var q = SE.cursor;
    if (SE.tool === 'brush' || SE.tool === 'rect') { pushUndo(); placeDef(SE.brush, q.x, q.y); touched(); drawSE(); }

  }
});
